# Public Next.js site on the VPS (not Vercel).
# DNS is NOT changed by this file.
#
# Preview now:  http://VPS_IP:8080
# After DNS + certbot: 443 for youthcamping.online
#
# Install:
#   cp deploy/nginx-public-on-vps.conf /etc/nginx/sites-available/youthcamping-public
#   Then include or append into the live youthcamping vhost and nginx -t && systemctl reload nginx

# Local-only preview (no TLS, no DNS required)
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Ready for DNS cutover (HTTP). After pointing A records here, run:
#   certbot --nginx -d youthcamping.online -d www.youthcamping.online
server {
    listen 80;
    listen [::]:80;
    server_name youthcamping.online www.youthcamping.online;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
