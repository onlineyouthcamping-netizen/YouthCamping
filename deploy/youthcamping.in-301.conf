# Old-origin 301 map for https://www.youthcamping.in and https://youthcamping.in
#
# The public site is on Vercel (youthcamping.online). The old .in domain is still
# served by BunnyCDN + the legacy origin. Do NOT shut down .in. Do NOT change DNS.
# Apply these 301s on the OLD origin / CDN so Google receives:
#   https://www.youthcamping.in/PATH  →  301  →  https://youthcamping.online/NEWPATH
# Directly to apex .online — do not chain through www.youthcamping.online.
#
# Vercel currently 307s apex → www. Before flipping DNS, set the Vercel project
# primary domain to youthcamping.online and redirect www → apex. Do not enable
# Next.js www→apex while Vercel still sends apex→www (that would loop).
#
# Same-path pages that already exist on the new site (/, /about-us, legal pages,
# /join-our-team, /manali-trekking-camp-with-youthcamping) should 301 host-only:
#   https://www.youthcamping.in/about-us → https://youthcamping.online/about-us

map $request_uri $yc_online_dest {
  /tours/spiti-valley-road-trip-137856  /trips/spiti-valley-road-trip;
  /tours/winter-spiti-156526  /trips/winter-spiti-road-trip;
  /tours/kerala-getaway-165724  /trips/kerala-trip;
  /tours/leh-to-leh-bike-expedition-2026-youth-camping-164365  /trips/leh-ladakh-bike-expedition-2026;
  /tours/magical-kashmir-backpacking-trip-138723  /trips/jannat-e-kashmir-backpacking-trip;
  /tours/manali-kasol-amritsar-adventure-trip-140500  /trips/manali-kasol-adventure;
  /tours/manali-kasol-amritsar-trip-137683  /trips/manali-kasol-summer-2026;
  /tours/kedarnath-tungnath-rishikesh-backpacking-trip  /trips/kedarnath-tungnath-rishikesh-trip;
  /tours/kedarnath-tungnath-rishikesh-multiple-starting-points-as-addons-138288  /trips/kedarnath-badrinath-tungnath-rishikesh;
  /tours/shimla-manali-kullu-138567  /trips/shimla-manali-kullu;
  /tours/shimla-manali-dalhousie-dharamshala-155815  /trips/shimla-manali-dalhousie-dharamshala;
  /collections  /trips;
  /collections/tours  /trips;
  /collections/backpacking-trips  /trips;
  /collections/trips-from-gujarat  /trips;
  /contact-us  /contact;
  /tour-packages  /trips;
  /about  /about-us;
}

server {
  listen 80;
  listen 443 ssl;
  server_name youthcamping.in www.youthcamping.in;

  # Keep /system/images on the old origin until assets are fully unused.
  location /system/images/ {
    try_files $uri =404;
  }

  location / {
    set $target $yc_online_dest;
    if ($target = "") {
      set $target $request_uri;
    }
    return 301 https://youthcamping.online$target;
  }
}
